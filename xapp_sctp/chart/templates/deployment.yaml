apiVersion: apps/v1
kind: Deployment
metadata:
  name: xapp-sctp
  namespace: ricxapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xapp-sctp
  template:
    metadata:
      labels:
        app: xapp-sctp
    spec:
      containers:
      - name: xapp-sctp
        image: xapp-sctp:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8080
        - name: rmr-data
          containerPort: 4560
        - name: rmr-route
          containerPort: 4561
        env:
        - name: DBAAS_SERVICE_HOST
          value: "service-ricplt-dbaas-tcp.ricplt.svc.cluster.local"
        - name: DBAAS_SERVICE_PORT
          value: "6379"
        - name: RMR_RTG_SVC
          value: "service-ricplt-rtmgr-rmr.ricplt.svc.cluster.local:4561"
        - name: RMR_SRC_ID
          value: "service-ricxapp-xapp-sctp-rmr.ricxapp"
        - name: RMR_SEED_RT
          value: "/root/config/uta_rtg.rt"
        - name: CFG_FILE
          value: "/root/config/config.json"
        - name: PLT_SUBMGR_URL
          value: "http://service-ricplt-submgr-http.ricplt:8080/ric/v1"
