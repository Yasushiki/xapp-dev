apiVersion: apps/v1
kind: Deployment
metadata:
  name: testar-e2sim
  namespace: ricxapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testar-e2sim
  template:
    metadata:
      labels:
        app: testar-e2sim
    spec:
      containers:
      - name: testar-e2sim
        image: testar-e2sim:latest
        imagePullPolicy: Never
        env:
        - name: DBAAS_SERVICE_HOST
          value: "service-ricplt-dbaas-tcp.ricplt.svc.cluster.local"
        - name: DBAAS_SERVICE_PORT
          value: "6379"
        - name: RMR_RTG_SVC
          value: "service-ricplt-rtmgr-rmr.ricplt.svc.cluster.local:4561"
        - name: RMR_SRC_ID
          value: "service-ricxapp-testar-e2sim-rmr.ricxapp"
        - name: RMR_SEED_RT
          value: "/root/config/uta_rtg.rt"
        - name: CFG_FILE
          value: "/root/config/config.json"
        - name: PLT_SUBMGR_URL
          value: "http://service-ricplt-submgr-http.ricplt:8080/ric/v1"
